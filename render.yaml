# ============================================================
# CINEGA — Render blueprint (deploy 1 cú: API + Web trong 1 Web Service)
# Sử dụng: Render Console → Blueprint → Connect repo → push này.
# Sau đó đổi Service Name trong Settings thành `cinega`.
# ============================================================
services:
  - type: web
    name: cinega
    env: node
    region: singapore
    plan: free
    buildCommand: npm install && npm run build:backend && npm run build:web
    startCommand: npm run start:backend
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: SUPABASE_URL
        sync: false                       # điền trong Render Dashboard
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: FRONTEND_URL
        value: https://mua-ve-xem-phim.onrender.com
      # TMDB - Backend cần key này để sync phim từ TMDB vào Supabase
      - key: TMDB_API_KEY
        sync: false
      # TMDB - Frontend (Vite) cần các biến này để gọi TMDB client-side
      - key: VITE_TMDB_API_KEY
        value: 13a6c132b1b02cf2a8c2a66d939c6928
      - key: VITE_TMDB_ACCESS_TOKEN
        sync: false
      - key: VITE_TMDB_IMAGE_BASE
        value: https://image.tmdb.org/t/p
      - key: SEPAY_API_KEY
        sync: false
      - key: SEPAY_WEBHOOK_SECRET
        sync: false
      - key: BANK_CODE
        value: '970422'
      - key: BANK_ACCOUNT_NUMBER
        value: '1900123456789'
      - key: BANK_ACCOUNT_NAME
        value: CINEGA ENTERTAINMENT